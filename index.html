<head>

<title>Sistem Surat Otomatis — Building Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#F5F4EF; --surface:#FFFFFF; --ink:#1C2733; --ink-soft:#66707C; --ink-faint:#9AA2AC;
  --line:#E1DED3; --line-strong:#C9C4B3;
  --navy:#1F3350; --navy-deep:#152539; --navy-mid:#28425F;
  --brass:#96772E; --brass-soft:#F1E9D6; --brass-line:#D9C68E;
  --danger:#AF4A34; --danger-soft:#F6E3DD; --ok:#2F6B4F; --ok-soft:#E1EFE6;
  --radius:10px; --radius-sm:6px;
  --shadow: 0 1px 2px rgba(28,39,51,.06), 0 8px 24px -12px rgba(28,39,51,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--paper); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
#app{display:flex; min-height:100vh;}
::selection{background:var(--brass-soft);}
a{color:inherit;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13.5px; color:var(--ink);}

/* ---------- Sidebar ---------- */
.sidebar{
  width:232px; flex:0 0 232px; background:var(--navy-deep); color:#EDE9DC; min-height:100vh;
  position:sticky; top:0; align-self:flex-start; display:flex; flex-direction:column;
  padding:22px 14px;
}
.brand{padding:4px 10px 22px; border-bottom:1px solid rgba(237,233,220,.12); margin-bottom:14px;}
.brand-mark{font-family:'Source Serif 4',serif; font-size:19px; font-weight:600; letter-spacing:.2px; color:#fff;}
.brand-sub{font-size:11px; color:#B9C2CE; margin-top:3px; letter-spacing:.3px;}
.nav-group{margin-bottom:6px;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; color:#CBD3DC;
  font-size:13.5px; font-weight:500; margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item:hover{background:rgba(237,233,220,.07); color:#fff;}
.nav-item.active{background:var(--navy-mid); color:#fff; box-shadow:inset 3px 0 0 var(--brass);}
.nav-ico{width:16px; text-align:center; opacity:.9; font-size:14px;}
.sidebar-foot{margin-top:auto; padding:12px 10px 4px; font-size:11px; color:#8593A2; border-top:1px solid rgba(237,233,220,.1);}

/* ---------- Main ---------- */
.main{flex:1; min-width:0; padding:28px 34px 60px;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px;}
.page-title{font-family:'Source Serif 4',serif; font-size:24px; font-weight:600; color:var(--navy-deep);}
.page-sub{color:var(--ink-soft); font-size:13px; margin-top:3px;}
.btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 16px; border-radius:7px; font-size:13.5px;
  font-weight:600; border:1px solid transparent; background:var(--surface); color:var(--ink); border-color:var(--line-strong);
  transition:.12s;
}
.btn:hover{border-color:var(--navy-mid); color:var(--navy-deep);}
.btn-primary{background:var(--navy-deep); color:#fff; border-color:var(--navy-deep);}
.btn-primary:hover{background:var(--navy-mid); color:#fff;}
.btn-brass{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn-brass:hover{background:#7E641F;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn-ghost:hover{color:var(--navy-deep); background:rgba(31,51,80,.06);}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:6px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ---------- Cards / layout blocks ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
.card-pad{padding:20px 22px;}
.grid{display:grid; gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.stat-card{padding:18px 20px;}
.stat-num{font-family:'Source Serif 4',serif; font-size:30px; font-weight:600; color:var(--navy-deep);}
.stat-label{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}

table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-soft); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--line-strong); white-space:nowrap;}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBFAF6;}

.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;}
.badge-draft{background:var(--brass-soft); color:#7E641F;}
.badge-terkirim{background:var(--ok-soft); color:var(--ok);}
.badge-selesai{background:#E4E9F0; color:var(--navy-mid);}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--navy-deep); margin-bottom:5px;}
.field .hint{font-size:11.5px; color:var(--ink-faint); margin-top:4px;}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=email],select,textarea{
  width:100%; padding:9px 11px; border:1px solid var(--line-strong); border-radius:7px; background:#fff; color:var(--ink);
}
textarea{resize:vertical; min-height:64px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-mid); outline-offset:0; border-color:var(--navy-mid);}
.row{display:grid; gap:12px;}
.row-2{grid-template-columns:1fr 1fr;}
.row-3{grid-template-columns:1fr 1fr 1fr;}
.row-4{grid-template-columns:1fr 1fr 1fr 1fr;}
.section-title{font-size:13px; font-weight:700; color:var(--navy-deep); text-transform:uppercase; letter-spacing:.4px; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line);}
.help-box{background:var(--brass-soft); border:1px solid var(--brass-line); border-radius:8px; padding:10px 13px; font-size:12.5px; color:#6B551F; margin-bottom:16px;}

/* ---------- Stepper ---------- */
.stepper{display:flex; align-items:center; margin-bottom:24px; overflow-x:auto; padding-bottom:2px;}
.step{display:flex; align-items:center; gap:8px; flex:0 0 auto;}
.step-num{width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; background:#fff; border:1.5px solid var(--line-strong); color:var(--ink-faint); flex:0 0 auto;}
.step.active .step-num{background:var(--navy-deep); border-color:var(--navy-deep); color:#fff;}
.step.done .step-num{background:var(--ok); border-color:var(--ok); color:#fff;}
.step-label{font-size:12px; font-weight:600; color:var(--ink-faint); white-space:nowrap;}
.step.active .step-label{color:var(--navy-deep);}
.step.done .step-label{color:var(--ok);}
.step-line{width:26px; height:1.5px; background:var(--line-strong); margin:0 6px; flex:0 0 auto;}

.wizard-body{display:grid; grid-template-columns:1.1fr .9fr; gap:20px; align-items:start;}
@media (max-width:1180px){.wizard-body{grid-template-columns:1fr;}}
.preview-side{position:sticky; top:20px;}

/* ---------- Letter paper ---------- */
.paper-wrap{background:#DCD9CE; border-radius:12px; padding:22px; overflow:auto; max-height:78vh;}
.paper{
  background:#fff; width:100%; max-width:560px; margin:0 auto; font-family:'Source Serif 4',serif;
  font-size:12.6px; line-height:1.62; color:#1a1a1a; box-shadow:0 10px 30px -10px rgba(0,0,0,.35); min-height:700px;
  display:flex; flex-direction:column; position:relative; overflow:hidden;
}
.paper .kop-watermark{position:absolute; left:0; bottom:0; width:52%; pointer-events:none; z-index:0; opacity:.9;}
.paper .kop-header-img{width:100%; display:block; position:relative; z-index:1;}
.paper .kop-footer-img{width:100%; display:block; margin-top:auto; position:relative; z-index:1;}
.paper .letter-body{padding:18px 44px 26px; position:relative; z-index:1;}
.paper .p-topline{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:0;}
.paper .p-delivery{font-weight:bold;text-decoration:underline;}
.paper .p-meta{margin-bottom:16px;}
.paper .p-meta div{margin-bottom:1px; display:flex;}
.paper .p-meta .p-meta-label{width:64px; flex-shrink:0;}
.paper .p-meta-hal span{font-weight:bold;}
.paper .p-to{margin-bottom:14px;}
.paper .p-hal-below{margin-top:14px;}
.paper p{margin:0 0 12px; text-align:justify;}
.detail-table{width:auto; border-collapse:collapse; margin:6px 0 16px 20px; font-size:12.6px;}
.detail-table td{padding:1px 8px 1px 0; border:none;}
.detail-table td.k{width:80px; white-space:nowrap;}
.sig-block{margin-top:34px;}
.sig-space{height:56px;}
.editable-note{font-size:11px; color:var(--ink-faint); margin-top:6px; font-family:'Inter',sans-serif;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute; left:0; top:0; width:100%;}
  .paper{box-shadow:none; max-width:100%;}
  .paper .letter-body{padding:8mm 25mm 14mm;}
  .paper-wrap{background:#fff; padding:0; max-height:none;}
}

/* ---------- Toolbar / search ---------- */
.toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.toolbar input,.toolbar select{width:auto;}
.search-input{min-width:220px;}
.spacer{flex:1;}
.empty-state{padding:50px 20px; text-align:center; color:var(--ink-soft);}
.empty-state .e-ico{font-size:30px; margin-bottom:10px;}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(21,30,42,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; z-index:200; overflow:auto;}
.modal{background:#fff; border-radius:12px; width:100%; max-width:640px; box-shadow:0 24px 60px -14px rgba(0,0,0,.4);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
.modal-title{font-size:16px; font-weight:700; color:var(--navy-deep); font-family:'Source Serif 4',serif;}
.modal-body{padding:20px 22px; max-height:70vh; overflow:auto;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.x-close{border:none; background:none; font-size:18px; color:var(--ink-faint); line-height:1; padding:4px;}

.tenant-chip{display:inline-flex; align-items:center; gap:6px; background:var(--brass-soft); border:1px solid var(--brass-line); color:#6B551F; padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600; margin:0 6px 6px 0;}
.tenant-chip button{border:none; background:none; color:#6B551F; font-weight:700; padding:0; font-size:12px;}
.tenant-pick-list{max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:8px;}
.tenant-pick-row{display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid var(--line); font-size:13px;}
.tenant-pick-row:last-child{border-bottom:none;}
.tenant-pick-row:hover{background:#FBFAF6;}
.toast{position:fixed; bottom:22px; right:22px; background:var(--navy-deep); color:#fff; padding:12px 18px; border-radius:8px; font-size:13px; font-weight:600; box-shadow:var(--shadow); z-index:300;}

.tmpl-card{border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px; background:#fff;}
.tmpl-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.tmpl-name{font-weight:700; color:var(--navy-deep); font-size:14.5px;}
.tmpl-sub{font-size:12px; color:var(--ink-soft);}
.action-row{display:flex; gap:6px; flex-wrap:wrap;}
.link-btn{background:none; border:none; color:var(--navy-mid); font-weight:600; font-size:12.5px; padding:4px 2px;}
.link-btn:hover{text-decoration:underline;}
.divider{height:1px; background:var(--line); margin:18px 0;}
</style>
</head>

function b64ToUint8Array(dataUrl){
  const b64 = dataUrl.split(",")[1];
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function fmtTanggalPanjang(iso){
  if(!iso) return "";
  const d=new Date(iso+"T00:00:00");
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
}

  if(!iso) return "";

  return d.toLocaleDateString("id-ID",{weekday:"long"});
}

  const d=new Date(iso+"T00:00:00");
  return ROMAN_MONTHS[d.getMonth()];
}
function fmtWaktuJam(t){ return t? t.replace(":","." ) : ""; }
const SATUAN=["","satu","dua","tiga","empat","lima","enam","tujuh","delapan","sembilan","sepuluh","sebelas"];
function terbilang(n){
  n=Math.round(Number(n)||0);
  if(n<0) return String(n);
  if(n<12) return SATUAN[n];
  if(n<20) return terbilang(n-10)+" belas";
  if(n<100){ const p=Math.floor(n/10), s=n%10; return terbilang(p)+" puluh"+(s?" "+terbilang(s):""); }
  if(n===100) return "seratus";
  if(n<1000){ const r=Math.floor(n/100), s=n%100; return (r===1?"seratus":terbilang(r)+" ratus")+(s?" "+terbilang(s):""); }
  return String(n);
}
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    }catch(e){ this.state = emptyState(); }

    this.loaded = true;
    await this.persist();
    this.render();
  },
  async persist(){
    try{ await window.storage.set("app-data", JSON.stringify(this.state), false); }catch(e){ console.error("storage error", e); }
  },
  async save(){ await this.persist(); this.render(); },
  toast(msg){
    const root=document.getElementById("toast-root");
    const isError = msg.indexOf("⚠")===0;
    root.innerHTML = '<div class="toast"'+(isError?' style="background:var(--danger); max-width:360px; white-space:normal;"':'')+'>'+esc(msg)+'</div>';
    setTimeout(()=>{ if(root.innerHTML.includes(esc(msg))) root.innerHTML=""; }, isError?6000:2400);
  },
  /* Some sandboxed/embedded environments silently block a JS-triggered download.
     So besides attempting the normal auto-download, always surface a real, user-clickable
     <a download> link as a guaranteed fallback. */
  offerDownload(blob, filename, kindLabel){
    const url = URL.createObjectURL(blob);
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this){ App.closeModal(); }">
        <div class="modal" style="max-width:420px; text-align:center;">
          <div class="modal-head" style="justify-content:center; border-bottom:none; padding-bottom:6px;">
            <div class="modal-title">✓ ${esc(kindLabel)} siap</div>
          </div>
          <div class="modal-body" style="padding-top:0;">
            <p style="color:var(--ink-soft); margin-top:0;">Jika unduhan tidak dimulai otomatis, klik tombol di bawah ini.</p>
            <a href="${url}" download="${esc(filename)}" onclick="setTimeout(()=>App.closeModal(),300)"
               class="btn btn-primary" style="width:100%; justify-content:center; text-decoration:none; padding:12px;">⬇ Unduh ${esc(filename)}</a>
          </div>
          <div class="modal-foot" style="justify-content:center;"><button class="btn btn-ghost" onclick="App.closeModal()">Tutup</button></div>
        </div>
      </div>`;
    // Best-effort automatic trigger too — if the environment allows it, the manual
    // link becomes unnecessary and the user simply sees the file appear.
    try{
      const a=document.createElement("a");
      a.href=url; a.download=filename; a.style.display="none";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }catch(e){ /* ignore — manual link above still works */ }
  },

      tenantMode: "all",
      tenantIds: [],
      penerimaNama: "Seluruh Penyewa (All Tenants)",
      penerimaPerusahaan: "",
      penerimaLokasi: "",
      penerimaAlamat: this.buildAllTenantAddress(""),
      hal: "Pemberitahuan Pemadaman Listrik",
      deskripsiPekerjaan: "", alasanPekerjaan: "", dampak: "", durasiAngka: 1, durasiSatuan: "jam",
      hari: "", tanggalPekerjaan: todayISO(), waktuMulai: "09:00", waktuSelesai: "10:00", areaTerdampak:"",
      apresiasi: (this.state.templates[0] && this.state.templates[0].appreciationParagraph) || DEFAULT_APRESIASI,
      kalimatPembuka: "",
      penutup: this.state.templates[0].closingParagraph,
      ttdNama: this.state.settings.signatoryName, ttdJabatan: this.state.settings.signatoryTitle,
      status: "Draft", dibuatOleh: this.state.settings.dibuatOleh, createdAt: new Date().toISOString(),
    };
    this.draft = Object.assign(d, prefill||{});
    this.draft.hari = fmtHari(this.draft.tanggalPekerjaan);
    this.wizardStep = 1;
  },
  nextNumber(dateISO){
    return (this.state.counter+1)+"/BM-TR/SK/"+romanMonthOf(dateISO)+"/"+new Date(dateISO+"T00:00:00").getFullYear();
  },
  templateByJenis(jenis){ return this.state.templates.find(t=>t.id===jenis) || this.state.templates.find(t=>t.jenis===jenis); },
  // Recipient address block for "All Tenants" / "Multiple Tenants": building name + affected
  // floor/area on the first line, then the building's public street address.
  buildAllTenantAddress(area){
    const s=this.state.settings;
    return "di "+s.buildingName+(area? " "+area : "")+"\n"+s.buildingAddress;
  },

  generateSentence(d){
    const durasiTeks = d.durasiAngka+" ("+terbilang(d.durasiAngka)+") "+d.durasiSatuan;
    const areaTeks = d.areaTerdampak ? " di "+d.areaTerdampak : "";
    const desc = d.deskripsiPekerjaan || "pekerjaan yang akan dilaksanakan";
    const dampak = d.dampak || "gangguan sementara pada operasional gedung";
    return "Sehubungan dengan adanya "+desc+areaTeks+", bersama ini kami informasikan bahwa akan terjadi "+dampak+" selama kurang lebih "+durasiTeks+", yang akan dilaksanakan dengan rincian sebagai berikut:";
  },

  applyTenantMode(mode){
    const d=this.draft;
    d.tenantMode = mode;
    if(mode==="all"){
      d.tenantIds=[];
      d.penerimaNama="Seluruh Penyewa (All Tenants)";
      d.penerimaPerusahaan="";
      d.penerimaAlamat=this.buildAllTenantAddress(d.areaTerdampak);
    } else if(mode==="individual"){
      d.penerimaNama = d.penerimaNama==="Seluruh Penyewa (All Tenants)" ? "" : d.penerimaNama;
    } else if(mode==="multiple"){
      d.penerimaNama = d.penerimaNama==="Seluruh Penyewa (All Tenants)" ? "" : d.penerimaNama;
    }
  },
  applyTenantSelection(){
    const d=this.draft;
    const chosen = this.state.tenants.filter(t=>d.tenantIds.includes(t.id));
    if(d.tenantMode==="individual" && chosen[0]){
      const t=chosen[0];
      d.penerimaNama = t.pic; d.penerimaPerusahaan = t.perusahaan;
      d.penerimaLokasi = "Lantai "+t.lantai+(t.unit? " – Unit "+t.unit:"");
      d.penerimaAlamat = t.alamat;
    } else if(d.tenantMode==="multiple" && chosen.length){
      d.penerimaNama = chosen.map(t=>t.perusahaan).join(", ");
      d.penerimaPerusahaan = "";
      d.penerimaLokasi = chosen.map(t=>"Lt. "+t.lantai).join(", ");
      d.penerimaAlamat = this.buildAllTenantAddress(d.areaTerdampak);
    }
  },

  finalizeCreate(){
    const d=this.draft;
    d.kalimatPembuka = d.kalimatPembuka || this.generateSentence(d);
    this.state.letters.unshift(d);
    this.state.counter += 1;
    this.persist().then(()=>{ this.toast("Surat "+d.nomorSurat+" berhasil dibuat"); this.navigate("riwayat"); });
  },
  updateExisting(){
    const d=this.draft;
    const idx=this.state.letters.findIndex(l=>l.id===d.id);
    if(idx>-1) this.state.letters[idx]=d;
    this.persist().then(()=>{ this.toast("Surat "+d.nomorSurat+" tersimpan"); this.navigate("riwayat"); });
  },
  duplicateLetter(id){
    const src=this.state.letters.find(l=>l.id===id);
    if(!src) return;
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = uid("srt");
    copy.tanggalSurat = todayISO();
    copy.nomorSurat = this.nextNumber(copy.tanggalSurat);
    copy.status = "Draft";
    copy.createdAt = new Date().toISOString();
    this.draft = copy;
    this.editingLetterId = null;
    this.wizardStep = 6; // go straight to preview/edit
    this.view = "buat";
    this.render();
    this.toast("Surat diduplikasi — nomor baru "+copy.nomorSurat);
  },
  editLetter(id){
    const src=this.state.letters.find(l=>l.id===id);
    if(!src) return;
    this.draft = JSON.parse(JSON.stringify(src));
    this.editingLetterId = id;
    this.wizardStep = 6;
    this.view = "buat";
    this.render();
  },
  deleteLetter(id){
    this.confirmModal("Hapus surat ini?","Tindakan ini tidak dapat dibatalkan.", ()=>{
      this.state.letters = this.state.letters.filter(l=>l.id!==id);
      this.persist().then(()=>{ this.toast("Surat dihapus"); this.render(); });
      this.closeModal();
    });
  },

  /* ---------------------- modal helpers ---------------------- */
  closeModal(){ document.getElementById("modal-root").innerHTML=""; },
  confirmModal(title, body, onConfirm, confirmLabel, confirmClass){
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
        <div class="modal" style="max-width:420px;">
          <div class="modal-head"><div class="modal-title">${esc(title)}</div><button class="x-close" onclick="App.closeModal()">✕</button></div>
          <div class="modal-body"><p style="margin:0;color:var(--ink-soft);">${esc(body)}</p></div>
          <div class="modal-foot"><button class="btn" onclick="App.closeModal()">Batal</button><button class="btn ${confirmClass||'btn-danger'}" id="confirm-yes">${esc(confirmLabel||"Hapus")}</button></div>
        </div>
      </div>`;
    document.getElementById("confirm-yes").onclick = onConfirm;
  },

  /* ============================== RENDER ============================== */
  render(){
    if(!this.loaded) return;
    const app=document.getElementById("app");
    app.innerHTML = this.sidebarHTML() + `<div class="main">${this.mainHTML()}</div>`;
    this.afterRenderHooks();
  },
  sidebarHTML(){
    const items = [
      ["dashboard","🏠","Dashboard"],
      ["buat","✍️","Buat Surat"],
      ["riwayat","🗂️","Riwayat Surat"],
      ["template","📄","Template"],
      ["tenant","🏢","Tenant"],
      ["settings","⚙️","Pengaturan"],
    ];
    return `<div class="sidebar">
      <div class="brand">
        <div class="brand-mark">Letter&nbsp;System</div>
        <div class="brand-sub">Building Management · Tenant Relation</div>
      </div>
      <div class="nav-group">
        ${items.map(([v,ic,label])=>`<button class="nav-item ${this.view===v?'active':''}" onclick="App.navigate('${v}')"><span class="nav-ico">${ic}</span>${label}</button>`).join("")}
      </div>
      <div class="sidebar-foot">Wisma 46 – Kota BNI<br>Tenant Relation · (021) 574 4408</div>
    </div>`;
  },
  mainHTML(){
    switch(this.view){
      case "buat": return this.renderBuat();
      case "riwayat": return this.renderRiwayat();
      case "template": return this.renderTemplate();
      case "tenant": return this.renderTenant();
      case "settings": return this.renderSettings();
      default: return this.renderDashboard();
    }
  },

  /* ---------------------------- Dashboard ---------------------------- */
  renderDashboard(){
    const letters=this.state.letters;
    const now=new Date();
    const thisMonth = letters.filter(l=>{ const d=new Date(l.tanggalSurat); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); }).length;
    const recent = letters.slice(0,5);
    return `
      <div class="page-head">
        <div><div class="page-title">Dashboard</div><div class="page-sub">Ringkasan aktivitas surat pemberitahuan tenant</div></div>
        <button class="btn btn-primary" onclick="App.newDraft(); App.navigate('buat')">+ Buat Surat Baru</button>
      </div>
      <div class="grid grid-3" style="margin-bottom:20px;">
        <div class="card stat-card"><div class="stat-num">${letters.length}</div><div class="stat-label">Total Surat</div></div>
        <div class="card stat-card"><div class="stat-num">${thisMonth}</div><div class="stat-label">Dibuat Bulan Ini</div></div>
        <div class="card stat-card"><div class="stat-num">${this.state.tenants.length}</div><div class="stat-label">Tenant Terdaftar</div></div>
      </div>
      <div class="card">
        <div class="card-pad" style="padding-bottom:0;"><div class="section-title" style="border:none; margin-bottom:6px;">Surat Terakhir</div></div>
        ${recent.length ? `<table><thead><tr><th>Nomor Surat</th><th>Jenis</th><th>Tanggal</th><th>Penerima</th><th>Status</th><th></th></tr></thead>
        <tbody>${recent.map(l=>`
          <tr>
            <td style="font-weight:600;">${esc(l.nomorSurat)}</td>
            <td>${esc(this.jenisLabel(l.jenis))}</td>
            <td>${fmtTanggalPanjang(l.tanggalSurat)}</td>
            <td>${esc(l.penerimaNama)}</td>
            <td>${this.statusBadge(l.status)}</td>
            <td><button class="link-btn" onclick="App.editLetter('${l.id}')">Buka</button></td>
          </tr>`).join("")}</tbody></table>` :
        `<div class="empty-state"><div class="e-ico">📭</div>Belum ada surat. Klik <b>Buat Surat Baru</b> untuk memulai.</div>`}
      </div>`;
  },
  jenisLabel(jenisId){ const t=this.templateByJenis(jenisId); return t? t.jenis : jenisId; },
  statusBadge(s){
    const cls = s==="Draft"?"badge-draft": s==="Terkirim"?"badge-terkirim":"badge-selesai";
    return `<span class="badge ${cls}">${esc(s)}</span>`;
  },

  /* ---------------------------- Buat Surat (wizard) ---------------------------- */
  renderBuat(){
    if(!this.draft) this.newDraft();
    const steps=["Pilih Template","Data Surat","Penerima","Detail Pekerjaan","Generate","Preview & Edit"];
    const d=this.draft;
    return `
      <div class="page-head">
        <div><div class="page-title">Buat Surat</div><div class="page-sub">${this.editingLetterId? 'Mengedit surat '+esc(d.nomorSurat) : 'Surat baru — isi data lalu preview sebelum diterbitkan'}</div></div>
        <button class="btn btn-ghost" onclick="App.navigate('riwayat')">Batal</button>
      </div>
      <div class="stepper">
        ${steps.map((s,i)=>{
          const n=i+1; const cls = n===this.wizardStep?'active': n<this.wizardStep?'done':'';
          return `<div class="step ${cls}"><div class="step-num">${n<this.wizardStep?'✓':n}</div><div class="step-label">${s}</div></div>${i<steps.length-1?'<div class="step-line"></div>':''}`;
        }).join("")}
      </div>
      <div class="wizard-body">
        <div>${this.renderWizardStep()}</div>
        <div class="preview-side">${this.renderLivePreview()}</div>
      </div>`;
  },
  renderWizardStep(){
    const d=this.draft, s=this.wizardStep;
    if(s===1) return this.stepTemplate();
    if(s===2) return this.stepDataSurat();
    if(s===3) return this.stepPenerima();
    if(s===4) return this.stepDetail();
    if(s===5) return this.stepGenerate();
    return this.stepPreviewEdit();
  },
  wizardNav(backLabel, nextLabel, backFn, nextFn){
    return `<div style="display:flex; justify-content:space-between; margin-top:18px;">
      <button class="btn" ${backFn? '' : 'disabled'} onclick="${backFn||''}">${backLabel||'← Kembali'}</button>
      <button class="btn btn-primary" onclick="${nextFn}">${nextLabel||'Lanjut →'}</button>
    </div>`;
  },

  stepTemplate(){
    const d=this.draft;
    return `<div class="card card-pad">
      <div class="section-title">Step 1 — Pilih Template / Jenis Pemberitahuan</div>
      <div class="row" style="grid-template-columns:repeat(3,1fr); gap:10px;">
        ${this.state.templates.map(t=>`
          <button class="btn ${d.templateId===t.id?'btn-primary':''}" style="justify-content:flex-start; text-align:left; padding:12px 14px; height:auto;"
            onclick="App.pickTemplate('${t.id}')">${esc(t.jenis)}</button>
        `).join("")}
      </div>
      ${this.wizardNav(null,"Lanjut → Data Surat", null, "App.wizardStep=2; App.render()")}
    </div>`;
  },
  pickTemplate(tid){
    const t=this.state.templates.find(x=>x.id===tid);
    const jenisMatch = JENIS_LIST.find(j=>j.label===t.jenis);
    this.draft.templateId = tid;
    this.draft.jenis = jenisMatch? jenisMatch.id : t.jenis;
    this.draft.hal = t.subjectDefault;
    this.draft.deskripsiPekerjaan = t.mainParagraphHint || "";
    this.draft.apresiasi = t.appreciationParagraph || DEFAULT_APRESIASI;
    this.draft.penutup = t.closingParagraph;
    this.draft.ttdNama = t.signatoryName || this.draft.ttdNama;
    this.draft.ttdJabatan = t.signatoryTitle || this.draft.ttdJabatan;
    this.render();
  },
  stepDataSurat(){
    const d=this.draft;
    return `<div class="card card-pad">
      <div class="section-title">Step 2 — Informasi Surat</div>
      <div class="row row-2">
        <div class="field"><label>Tanggal Surat</label><input type="date" value="${d.tanggalSurat}" onchange="App.draft.tanggalSurat=this.value; App.draft.nomorSurat=App.draft.nomorSurat||App.nextNumber(this.value); App.render()"></div>
        <div class="field"><label>Nomor Surat</label><input type="text" value="${esc(d.nomorSurat)}" onchange="App.draft.nomorSurat=this.value">
          <div class="hint">Otomatis: ${esc(this.nextNumber(d.tanggalSurat))} — dapat diubah manual.</div></div>
      </div>
      <div class="row row-2">
        <div class="field"><label>Kota</label><input type="text" value="${esc(d.kota)}" onchange="App.draft.kota=this.value"></div>
        <div class="field"><label>Metode Pengiriman</label>
          <select onchange="App.draft.metodePengiriman=this.value">
            ${["Melalui Email","Hand Delivery","Lainnya"].map(m=>`<option ${d.metodePengiriman===m?'selected':''}>${m}</option>`).join("")}
          </select></div>
      </div>
      <div class="field"><label>Hal / Perihal</label><input type="text" value="${esc(d.hal)}" onchange="App.draft.hal=this.value"></div>
      ${this.wizardNav("← Kembali","Lanjut → Penerima","App.wizardStep=1; App.render()","App.wizardStep=3; App.render()")}
    </div>`;
  },
  stepPenerima(){
    const d=this.draft, tenants=this.state.tenants;
    return `<div class="card card-pad">
      <div class="section-title">Step 3 — Penerima</div>
      <div class="field"><label>Mode Penerima</label>
        <div class="row row-3">
          ${[["individual","Individual Tenant"],["multiple","Multiple Tenants"],["all","All Tenants"]].map(([v,l])=>`
            <button class="btn ${d.tenantMode===v?'btn-primary':''}" onclick="App.applyTenantMode('${v}'); App.render()">${l}</button>`).join("")}
        </div>
      </div>
      ${d.tenantMode!=="all" ? `
      <div class="field"><label>Pilih Tenant</label>
        <div class="tenant-pick-list">
          ${tenants.map(t=>`
            <label class="tenant-pick-row">
              <input type="${d.tenantMode==='individual'?'radio':'checkbox'}" name="tenantpick" ${d.tenantIds.includes(t.id)?'checked':''}
                onchange="App.toggleTenantPick('${t.id}','${d.tenantMode}')">
              <span><b>${esc(t.perusahaan)}</b> — Lt.${esc(t.lantai)} · ${esc(t.pic)}</span>
            </label>`).join("") || '<div style="padding:14px;color:var(--ink-faint);">Belum ada data tenant. Tambahkan di halaman Tenant.</div>'}
        </div>
      </div>` : `<div class="help-box">Penerima diatur otomatis sebagai <b>Seluruh Penyewa (All Tenants)</b>.</div>`}
      <div class="field"><label>Nama Penerima (di surat)</label><input type="text" value="${esc(d.penerimaNama)}" onchange="App.draft.penerimaNama=this.value"></div>
      <div class="field"><label>Alamat Penerima</label><textarea onchange="App.draft.penerimaAlamat=this.value">${esc(d.penerimaAlamat)}</textarea></div>
      ${this.wizardNav("← Kembali","Lanjut → Detail Pekerjaan","App.wizardStep=2; App.render()","App.wizardStep=4; App.render()")}
    </div>`;
  },
  toggleTenantPick(tid, mode){
    const d=this.draft;
    if(mode==="individual"){ d.tenantIds=[tid]; }
    else{
      const i=d.tenantIds.indexOf(tid);
      if(i>-1) d.tenantIds.splice(i,1); else d.tenantIds.push(tid);
    }
    this.applyTenantSelection();
    this.render();
  },
  stepDetail(){
    const d=this.draft;
    return `<div class="card card-pad">
      <div class="section-title">Step 4 — Detail Pekerjaan / Pemberitahuan</div>
      <div class="field"><label>Jenis Pemberitahuan</label>
        <select onchange="App.draft.jenis=this.value">
          ${JENIS_LIST.map(j=>`<option value="${j.id}" ${d.jenis===j.id?'selected':''}>${j.label}</option>`).join("")}
        </select></div>
      <div class="field"><label>Deskripsi Pekerjaan</label><textarea placeholder="mis. penyambungan kabel trafo listrik" onchange="App.draft.deskripsiPekerjaan=this.value">${esc(d.deskripsiPekerjaan)}</textarea></div>
      <div class="field"><label>Alasan Pekerjaan</label><textarea onchange="App.draft.alasanPekerjaan=this.value">${esc(d.alasanPekerjaan)}</textarea></div>
      <div class="field"><label>Dampak terhadap Tenant</label><input type="text" placeholder="mis. pemadaman aliran listrik sementara" value="${esc(d.dampak)}" onchange="App.draft.dampak=this.value"></div>
      <div class="row row-2">
        <div class="field"><label>Durasi</label>
          <div class="row row-2" style="gap:8px;">
            <input type="number" min="1" value="${d.durasiAngka}" onchange="App.draft.durasiAngka=this.value">
            <select onchange="App.draft.durasiSatuan=this.value">${DURASI_UNITS.map(u=>`<option ${d.durasiSatuan===u?'selected':''}>${u}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field"><label>Area Terdampak</label><input type="text" placeholder="mis. Lantai 6" value="${esc(d.areaTerdampak)}" onchange="App.draft.areaTerdampak=this.value; if(App.draft.tenantMode!=='individual'){ App.draft.penerimaAlamat=App.buildAllTenantAddress(this.value); } App.render()"></div>
      </div>
      <div class="row row-3">
        <div class="field"><label>Tanggal Pekerjaan</label><input type="date" value="${d.tanggalPekerjaan}" onchange="App.draft.tanggalPekerjaan=this.value; App.draft.hari=fmtHari(this.value); App.render()"></div>
        <div class="field"><label>Waktu Mulai</label><input type="time" value="${d.waktuMulai}" onchange="App.draft.waktuMulai=this.value"></div>
        <div class="field"><label>Waktu Selesai</label><input type="time" value="${d.waktuSelesai}" onchange="App.draft.waktuSelesai=this.value"></div>
      </div>
      <div class="field"><label>Hari (otomatis)</label><input type="text" value="${esc(d.hari)}" disabled style="background:#F5F4EF;"></div>
      ${this.wizardNav("← Kembali","Lanjut → Generate","App.wizardStep=3; App.render()","App.wizardStep=5; App.draft.kalimatPembuka=App.generateSentence(App.draft); App.render()")}
    </div>`;
  },
  stepGenerate(){
    const d=this.draft;
    if(!d.kalimatPembuka) d.kalimatPembuka = this.generateSentence(d);
    return `<div class="card card-pad">
      <div class="section-title">Step 5 — Smart Sentence Generator</div>
      <div class="help-box">Kalimat berikut disusun otomatis dari data pekerjaan. Anda dapat mengeditnya secara manual sebelum melanjutkan.</div>
      <div class="field"><label>Paragraf Apresiasi (opsional)</label><textarea style="min-height:80px;" onchange="App.draft.apresiasi=this.value">${esc(d.apresiasi)}</textarea>
        <div class="hint">Muncul setelah "Dengan hormat," dan sebelum kalimat pemberitahuan. Kosongkan untuk menghilangkan.</div></div>
      <div class="field"><label>Kalimat Pembuka</label><textarea style="min-height:110px;" onchange="App.draft.kalimatPembuka=this.value">${esc(d.kalimatPembuka)}</textarea>
        <button class="link-btn" onclick="App.draft.kalimatPembuka=App.generateSentence(App.draft); App.render()">↻ Generate ulang dari data</button></div>
      <div class="field"><label>Paragraf Penutup</label><textarea style="min-height:110px;" onchange="App.draft.penutup=this.value">${esc(d.penutup)}</textarea></div>
      <div class="row row-2">
        <div class="field"><label>Nama Penandatangan</label><input type="text" value="${esc(d.ttdNama)}" onchange="App.draft.ttdNama=this.value"></div>
        <div class="field"><label>Jabatan Penandatangan</label><input type="text" value="${esc(d.ttdJabatan)}" onchange="App.draft.ttdJabatan=this.value"></div>
      </div>
      ${this.wizardNav("← Kembali","Lanjut → Preview","App.wizardStep=4; App.render()","App.wizardStep=6; App.render()")}
    </div>`;
  },
  stepPreviewEdit(){
    const d=this.draft;
    return `<div class="card card-pad">
      <div class="section-title">Step 6 — Preview &amp; Edit Akhir</div>
      <p style="color:var(--ink-soft); margin-top:0;">Pratinjau surat ditampilkan di sebelah kanan. Semua teks pada surat dapat diedit langsung di form pada langkah-langkah sebelumnya.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
        <button class="btn" onclick="App.wizardStep=5; App.render()">← Edit Kalimat</button>
        <button class="btn" onclick="App.wizardStep=4; App.render()">← Edit Detail Pekerjaan</button>
        <button class="btn" onclick="App.wizardStep=3; App.render()">← Edit Penerima</button>
      </div>
      <div class="divider"></div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-brass" onclick="App.exportPDF()">⬇ Download PDF</button>
        <button class="btn btn-brass" onclick="App.exportDOCX()">⬇ Download DOCX</button>
        <button class="btn" onclick="App.exportRTF()" title="Format lama yang selalu bisa dibuka oleh Word 97-2003 ke atas">⬇ Download DOC (Word 97-2003)</button>
        <button class="btn" onclick="window.print()">🖨 Print</button>

  /* ---------------------------- Export: PDF / DOCX ---------------------------- */
  async exportPDF(){
    if(!(window.jspdf && window.jspdf.jsPDF)){
      this.toast("Memuat pustaka PDF...");
      await window.__libsReadyPromise;
    }
    if(!(window.jspdf && window.jspdf.jsPDF)){
      this.toast("⚠ Gagal memuat pustaka PDF (jsPDF). Periksa koneksi internet Anda, lalu muat ulang halaman.");
      return;
    }
    try{
    const d=this.draft;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:"mm", format:"a4"});
    const pageW=210, pageH=297;
    const headerH = pageW*(204/1000), footerH = pageW*(162/1000); // matches cropped letterhead image aspect ratio
    const marginL=25, marginR=25, usableW=pageW-marginL-marginR;
    const topStart = headerH+10, bottomLimit = pageH-footerH-8;
    const drawKop = ()=>{
      const wmW = pageW*0.40, wmH = wmW*(900/480);
      doc.addImage(KOP_WATERMARK_IMG, "PNG", 0, pageH-wmH, wmW, wmH);
      doc.addImage(KOP_HEADER_IMG, "PNG", 0, 0, pageW, headerH);
      doc.addImage(KOP_FOOTER_IMG, "PNG", 0, pageH-footerH, pageW, footerH);
    };
    const ensureSpace = (need)=>{
      if(y+need > bottomLimit){ doc.addPage(); drawKop(); y = topStart; }
    };
    drawKop();
    let y=topStart;
    doc.setFont("times","normal");
    doc.setFontSize(11);
    const leftText = `${d.kota}, ${fmtTanggalPanjang(d.tanggalSurat)}`;
    doc.text(leftText, marginL, y);
    doc.setFont("times","bold");
    { const _mw = doc.getTextWidth(d.metodePengiriman); const _mx = pageW-marginR-_mw;
      doc.text(d.metodePengiriman, pageW-marginR, y, {align:"right"});
      doc.setLineWidth(0.3); doc.line(_mx, y+1, pageW-marginR, y+1); }
    doc.setFont("times","normal"); y+=6;
    const metaValX = marginL+20;
    doc.text("No. Ref.", marginL, y); doc.text(": "+d.nomorSurat, metaValX, y); y+=8;
    doc.text("Kepada Yth.", marginL, y); y+=6;
    doc.setFont("times","bold"); doc.text(d.penerimaNama, marginL, y); doc.setFont("times","normal"); y+=6;
    if(d.penerimaPerusahaan){ doc.text(d.penerimaPerusahaan, marginL, y); y+=6; }
    if(d.penerimaLokasi){ doc.text(d.penerimaLokasi, marginL, y); y+=6; }
    (d.penerimaAlamat||"").split("\n").forEach(line=>{ doc.text(line, marginL, y); y+=6; });
    y+=6;
    doc.setFont("times","bold"); doc.text("Hal", marginL, y); doc.text(": "+d.hal, metaValX, y); doc.setFont("times","normal"); y+=8;
    y+=4;
    doc.text("Dengan hormat,", marginL, y); y+=8;
    if(d.apresiasi && d.apresiasi.trim()){
      const apresiasiLines = doc.splitTextToSize(d.apresiasi.trim(), usableW);
      ensureSpace(apresiasiLines.length*5.6);
      doc.text(d.apresiasi.trim(), marginL, y, {maxWidth:usableW, align:"justify"});
      y += apresiasiLines.length*5.6 + 4;
    }
    const bodyLines = doc.splitTextToSize(d.kalimatPembuka, usableW);
    ensureSpace(bodyLines.length*5.6);
    doc.text(d.kalimatPembuka, marginL, y, {maxWidth:usableW, align:"justify"});
    y += bodyLines.length*5.6 + 4;
    const detailX = marginL+8;
    ensureSpace(24);
    doc.text("Hari", detailX, y); doc.text(": "+d.hari, detailX+22, y); y+=6;
    doc.text("Tanggal", detailX, y); doc.text(": "+fmtTanggalPanjang(d.tanggalPekerjaan), detailX+22, y); y+=6;
    doc.text("Waktu", detailX, y); doc.text(": Pukul "+d.waktuMulai+" s.d. "+d.waktuSelesai+" WIB", detailX+22, y); y+=6;
    if(d.areaTerdampak){ doc.text("Area", detailX, y); doc.text(": "+d.areaTerdampak, detailX+22, y); y+=6; }
    y+=4;
    (d.penutup||"").split("\n\n").forEach(para=>{
      if(!para.trim()) return;
      const lines = doc.splitTextToSize(para.trim(), usableW);
      ensureSpace(lines.length*5.6);
      doc.text(para.trim(), marginL, y, {maxWidth:usableW, align:"justify"});
      y += lines.length*5.6 + 4;
    });
    ensureSpace(36);
    y+=4;
    doc.text("Hormat kami,", marginL, y); y+=24;
    doc.setFont("times","bold"); doc.text(d.ttdNama, marginL, y);
    const ttdWidth = doc.getTextWidth(d.ttdNama);
    doc.setLineWidth(0.25); doc.line(marginL, y+0.8, marginL+ttdWidth, y+0.8);
    doc.setFont("times","normal"); y+=6;
    doc.text(d.ttdJabatan, marginL, y);
    const pdfBlob = doc.output("blob");
    this.offerDownload(pdfBlob, `Surat_${d.nomorSurat.replace(/\//g,"-")}.pdf`, "PDF");
    this.toast("PDF siap diunduh");
    }catch(err){
      console.error("[surat-app] exportPDF error:", err);
      this.toast("⚠ Gagal membuat PDF: "+(err && err.message ? err.message : "kesalahan tidak diketahui"));
    }
  },
  async exportDOCX(){
    if(!(window.docx && window.docx.Document)){
      this.toast("Memuat pustaka DOCX...");
      await window.__libsReadyPromise;
    }
    if(!(window.docx && window.docx.Document)){
      this.toast("⚠ Gagal memuat pustaka DOCX. Periksa koneksi internet Anda, lalu muat ulang halaman.");

    }
    try{
    const d=this.draft;
    const { Document, Packer, Paragraph, TextRun, AlignmentType, Table, TableRow, TableCell, WidthType, BorderStyle, Header, Footer, ImageRun, RelativeHorizontalPosition, RelativeVerticalPosition, HorizontalPositionAlign, VerticalPositionAlign, TextWrappingType } = window.docx;
    // Page is 12240 DXA wide (A4, 210mm); build header/footer images at full page width, scaled to their real aspect ratio.
    const pageWidthDXA = 11906; // A4 width in twips (210mm)
    const headerImgWidth = 620, headerImgHeight = Math.round(620*(204/1000));
    const footerImgWidth = 620, footerImgHeight = Math.round(620*(162/1000));

    const docHeader = new Header({children:[new Paragraph({alignment:AlignmentType.CENTER, children:[
      new ImageRun({data:b64ToUint8Array(KOP_HEADER_IMG), type:"png", transformation:{width:headerImgWidth, height:headerImgHeight}}),
      watermarkRun,
    ]})]});
    const docFooter = new Footer({children:[new Paragraph({alignment:AlignmentType.CENTER, children:[
      new ImageRun({data:b64ToUint8Array(KOP_FOOTER_IMG), type:"png", transformation:{width:footerImgWidth, height:footerImgHeight}})
    ]})]});
    const noBorder = {top:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},bottom:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},left:{style:BorderStyle.NONE,size:0,color:"FFFFFF"},right:{style:BorderStyle.NONE,size:0,color:"FFFFFF"}};
    const cell=(text,width)=>new TableCell({borders:noBorder, width:{size:width,type:WidthType.DXA}, children:[new Paragraph({children:[new TextRun({text, font:"Times New Roman", size:24})]})]});
    const cellBold=(text,width)=>new TableCell({borders:noBorder, width:{size:width,type:WidthType.DXA}, children:[new Paragraph({children:[new TextRun({text, bold:true, font:"Times New Roman", size:24})]})]});
    const detailRows = [["Hari", d.hari], ["Tanggal", fmtTanggalPanjang(d.tanggalPekerjaan)], ["Waktu", "Pukul "+d.waktuMulai+" s.d. "+d.waktuSelesai+" WIB"]];
    if(d.areaTerdampak) detailRows.push(["Area", d.areaTerdampak]);
    const detailTable = new Table({

    const paras=[];
    const toplineTable = new Table({

        new TableCell({borders:noBorder, width:{size:5000,type:WidthType.DXA}, children:[new Paragraph({children:[new TextRun({text:`${d.kota}, ${fmtTanggalPanjang(d.tanggalSurat)}`, font:"Times New Roman", size:24})]})]}),
        new TableCell({borders:noBorder, width:{size:5000,type:WidthType.DXA}, children:[new Paragraph({alignment:AlignmentType.RIGHT, children:[new TextRun({text:d.metodePengiriman, bold:true, underline:{}, font:"Times New Roman", size:24})]})]}),
      ]})]
    });
    paras.push(toplineTable);
    const metaTable = new Table({
      width:{size:100,type:WidthType.PERCENT},
      rows:[
        new TableRow({children:[cell("No. Ref.",1600), cell(": "+d.nomorSurat,8400)]}),
      ]

    paras.push(metaTable);
    paras.push(new Paragraph({text:"", spacing:{after:200}}));

    paras.push(new Paragraph({children:[new TextRun({text:d.penerimaNama, bold:true, font:"Times New Roman", size:24})]}));
    if(d.penerimaPerusahaan) paras.push(new Paragraph({children:[new TextRun({text:d.penerimaPerusahaan, font:"Times New Roman", size:24})]}));
    if(d.penerimaLokasi) paras.push(new Paragraph({children:[new TextRun({text:d.penerimaLokasi, font:"Times New Roman", size:24})]}));
    (d.penerimaAlamat||"").split("\n").forEach(line=> paras.push(new Paragraph({children:[new TextRun({text:line, font:"Times New Roman", size:24})]})));
    paras.push(new Paragraph({text:"", spacing:{after:100}}));
    const halTable = new Table({

    paras.push(halTable);
    paras.push(new Paragraph({text:"", spacing:{after:100}}));
    paras.push(new Paragraph({children:[new TextRun({text:"Dengan hormat,", font:"Times New Roman", size:24})], spacing:{after:200}}));
    if(d.apresiasi && d.apresiasi.trim()){
      paras.push(new Paragraph({children:[new TextRun({text:d.apresiasi.trim(), font:"Times New Roman", size:24})], spacing:{after:200}, alignment:AlignmentType.JUSTIFIED}));
    }
    paras.push(new Paragraph({children:[new TextRun({text:d.kalimatPembuka, font:"Times New Roman", size:24})], spacing:{after:200}, alignment:AlignmentType.JUSTIFIED}));
    paras.push(detailTable);

    (d.penutup||"").split("\n\n").forEach(p=>{

    });

    const document = new Document({sections:[{
      properties:{page:{margin:{top:2100,bottom:1900,left:1440,right:1440,header:520,footer:480}}},
      headers:{default:docHeader}, footers:{default:docFooter},
      children:paras

    Packer.toBlob(document).then(blob=>{
      this.offerDownload(blob, `Surat_${d.nomorSurat.replace(/\//g,"-")}.docx`, "DOCX");
      this.toast("DOCX siap diunduh");
    }).catch(err=>{
      console.error("[surat-app] exportDOCX Packer error:", err);
      this.toast("⚠ Gagal membuat DOCX: "+(err && err.message ? err.message : "kesalahan tidak diketahui"));

  /* Legacy Word 97-2003 compatible export. True binary .doc can't be generated in-browser,
     but RTF is a real, open, decades-old Word format that Word 97-2003 and every version since
     opens natively — so we generate RTF and save it with a .doc name for maximum compatibility. */
  b64ToHex(dataUrl){
    const bin = atob(dataUrl.split(",")[1]);
    let hex = "";
    for(let i=0;i<bin.length;i++){ hex += bin.charCodeAt(i).toString(16).padStart(2,"0"); }
    return hex;
  },
  rtfEscape(s){
    return (s==null?"":String(s))
      .replace(/\\/g,"\\\\").replace(/{/g,"\\{").replace(/}/g,"\\}")
      .replace(/\n/g,"\\par\n")
      .replace(/[\u0080-\uFFFF]/g, ch => "\\u"+ch.charCodeAt(0)+"?");
  },
  rtfImage(dataUrl, kind, widthPx, heightPx, goalWidthTwips){
    const hex = this.b64ToHex(dataUrl);
    const goalW = goalWidthTwips;
    const goalH = Math.round(goalWidthTwips*(heightPx/widthPx));
    const tag = kind==="png" ? "\\pngblip" : "\\jpegblip";
    return `{\\pict${tag}\\picw${goalW}\\pich${goalH}\\picwgoal${goalW}\\pichgoal${goalH} ${hex}}`;
  },
  exportRTF(){
    try{
      const d=this.draft;
      const pageW=11906, pageH=16838; // A4 in twips
      const headerImg = this.rtfImage(KOP_HEADER_IMG, "png", 1000, 204, pageW-1440);
      const footerImg = this.rtfImage(KOP_FOOTER_IMG, "png", 1000, 162, pageW-1440);
      const esc = s=>this.rtfEscape(s);
      const detailRows = [["Hari", d.hari], ["Tanggal", fmtTanggalPanjang(d.tanggalPekerjaan)], ["Waktu", "Pukul "+d.waktuMulai+" s.d. "+d.waktuSelesai+" WIB"]];
      if(d.areaTerdampak) detailRows.push(["Area", d.areaTerdampak]);
      const detailLines = detailRows.map(([k,v])=>`{\\tab}${esc(k)}{\\tab}: ${esc(v)}\\par`).join("\n");
      const penutupPars = (d.penutup||"").split("\n\n").filter(p=>p.trim()).map(p=>`${esc(p.trim())}\\par\\par`).join("\n");
      const rtf = `{\\rtf1\\ansi\\ansicpg1252\\deff0\\deflang1033
{\\fonttbl{\\f0\\froman Times New Roman;}}
\\paperw${pageW}\\paperh${pageH}\\margl1440\\margr1440\\margt900\\margb900
\\f0\\fs24
\\qc ${headerImg}\\par
\\pard\\par
${esc(d.kota)}, ${esc(fmtTanggalPanjang(d.tanggalSurat))}\\tab\\tab\\tab\\b\\ul ${esc(d.metodePengiriman)}\\b0\\ulnone\\par
\\pard\\tx1200
No. Ref.\\tab: ${esc(d.nomorSurat)}\\par
\\pard\\par
Kepada Yth.\\par
{\\b ${esc(d.penerimaNama)}}\\par
${d.penerimaPerusahaan? esc(d.penerimaPerusahaan)+"\\par\n" : ""}${d.penerimaLokasi? esc(d.penerimaLokasi)+"\\par\n" : ""}${esc(d.penerimaAlamat)}\\par
\\par
\\pard\\tx1200
{\\b Hal\\tab: ${esc(d.hal)}}\\par
\\pard\\par
Dengan hormat,\\par
\\par
\\qj ${d.apresiasi && d.apresiasi.trim() ? esc(d.apresiasi.trim())+"\\par\\par\n" : ""}${esc(d.kalimatPembuka)}\\par
\\ql\\par
${detailLines}
\\par
\\qj
${penutupPars}
\\ql Hormat kami,\\par
\\par\\par\\par
{\\b\\ul ${esc(d.ttdNama)}}\\par
${esc(d.ttdJabatan)}\\par
\\par
\\qc ${footerImg}\\par
}`;
      const blob = new Blob([rtf], {type:"application/rtf"});
      this.offerDownload(blob, `Surat_${d.nomorSurat.replace(/\//g,"-")}.doc`, "DOC (Word 97-2003)");
      this.toast("DOC siap diunduh");
    }catch(err){
      console.error("[surat-app] exportRTF error:", err);
      this.toast("⚠ Gagal membuat DOC: "+(err && err.message ? err.message : "kesalahan tidak diketahui"));
    }
  },

      list=list.filter(l=> (l.nomorSurat+l.penerimaNama+l.hal).toLowerCase().includes(q));
    }
    if(r.jenis) list=list.filter(l=>l.jenis===r.jenis);
    if(r.tenant) list=list.filter(l=>l.penerimaNama.toLowerCase().includes(r.tenant.toLowerCase()) || (l.penerimaPerusahaan||"").toLowerCase().includes(r.tenant.toLowerCase()));
    if(r.from) list=list.filter(l=>l.tanggalSurat>=r.from);
    if(r.to) list=list.filter(l=>l.tanggalSurat<=r.to);
    list.sort((a,b)=>{
      if(r.sort==="tanggal_desc") return b.tanggalSurat.localeCompare(a.tanggalSurat);
      if(r.sort==="tanggal_asc") return a.tanggalSurat.localeCompare(b.tanggalSurat);
      if(r.sort==="nomor_desc") return (b.nomorSurat).localeCompare(a.nomorSurat, undefined, {numeric:true});

          <span style="color:var(--ink-faint);">s/d</span>
          <input type="date" value="${r.to}" onchange="App.riwayat.to=this.value; App.render()">
          <select onchange="App.riwayat.sort=this.value; App.render()">
            <option value="tanggal_desc" ${r.sort==='tanggal_desc'?'selected':''}>Tanggal terbaru</option>
            <option value="tanggal_asc" ${r.sort==='tanggal_asc'?'selected':''}>Tanggal terlama</option>
            <option value="nomor_desc" ${r.sort==='nomor_desc'?'selected':''}>Nomor ↓</option>
            <option value="nomor_asc" ${r.sort==='nomor_asc'?'selected':''}>Nomor ↑</option>
          </select>
        </div>
        ${list.length ? `<table><thead><tr>
          <th>Nomor</th><th>Tanggal</th><th>Penerima</th><th>Perihal</th><th>Jenis</th><th>Tgl. Pekerjaan</th><th>Status</th><th>Dibuat oleh</th><th></th>
        </tr></thead><tbody>
          ${list.map(l=>`
          <tr>
            <td style="font-weight:600;">${esc(l.nomorSurat)}</td>
            <td>${fmtTanggalPanjang(l.tanggalSurat)}</td>
            <td>${esc(l.penerimaNama)}</td>

            <td>${esc(l.dibuatOleh)}</td>
            <td><div class="action-row">
              <button class="link-btn" onclick="App.editLetter('${l.id}')">Preview/Edit</button>
              <button class="link-btn" onclick="App.duplicateLetter('${l.id}')">Duplicate</button>
              <button class="link-btn" onclick="App.quickExport('${l.id}','pdf')">PDF</button>
              <button class="link-btn" onclick="App.quickExport('${l.id}','docx')">DOCX</button>
              <button class="link-btn" onclick="App.quickExport('${l.id}','doc')">DOC</button>
              <button class="link-btn" style="color:var(--danger);" onclick="App.deleteLetter('${l.id}')">Hapus</button>
            </div></td>
          </tr>`).join("")}
        </tbody></table>` : `<div class="empty-state"><div class="e-ico">🔍</div>Tidak ada surat yang cocok dengan filter.</div>`}
      </div>`;
  },
  async quickExport(id, kind){
    const l=this.state.letters.find(x=>x.id===id);
    if(!l) return;
    const prevDraft=this.draft;
    this.draft = l;
    if(kind==="pdf") await this.exportPDF(); else if(kind==="doc") await this.exportRTF(); else await this.exportDOCX();
    this.draft = prevDraft;
  },

  /* ---------------------------- Template management ---------------------------- */
  renderTemplate(){
    return `
      <div class="page-head">
        <div><div class="page-title">Template Surat</div><div class="page-sub">Kelola paragraf default untuk setiap jenis pemberitahuan</div></div>
        <button class="btn btn-primary" onclick="App.openTemplateModal(null)">+ Tambah Template</button>
      </div>
      ${this.state.templates.map(t=>`
        <div class="tmpl-card">
          <div class="tmpl-card-head">
            <div><div class="tmpl-name">${esc(t.jenis)}</div><div class="tmpl-sub">Hal default: ${esc(t.subjectDefault)}</div></div>
            <div class="action-row">
              <button class="btn btn-sm" onclick="App.openTemplateModal('${t.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="App.deleteTemplate('${t.id}')">Hapus</button>
            </div>
          </div>
          <div style="font-size:12.5px; color:var(--ink-soft);">Penandatangan: ${esc(t.signatoryName)} — ${esc(t.signatoryTitle)}</div>
        </div>`).join("")}
    `;
  },
  openTemplateModal(id){
    const t = id? this.state.templates.find(x=>x.id===id) : {id:null, jenis:"", subjectDefault:"", appreciationParagraph:DEFAULT_APRESIASI, mainParagraphHint:"", closingParagraph:"", contactPerson:"", signatoryName:this.state.settings.signatoryName, signatoryTitle:this.state.settings.signatoryTitle};
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
        <div class="modal">
          <div class="modal-head"><div class="modal-title">${id?'Edit Template':'Template Baru'}</div><button class="x-close" onclick="App.closeModal()">✕</button></div>
          <div class="modal-body">
            <div class="field"><label>Nama Jenis</label><input id="tf-jenis" type="text" value="${esc(t.jenis)}"></div>
            <div class="field"><label>Subject / Hal Default</label><input id="tf-subject" type="text" value="${esc(t.subjectDefault)}"></div>
            <div class="field"><label>Paragraf Apresiasi (setelah "Dengan hormat,")</label><textarea id="tf-apresiasi" style="min-height:80px;">${esc(t.appreciationParagraph)}</textarea></div>
            <div class="field"><label>Deskripsi Pekerjaan Default (Main Paragraph)</label><textarea id="tf-main">${esc(t.mainParagraphHint)}</textarea></div>
            <div class="field"><label>Paragraf Penutup</label><textarea id="tf-closing" style="min-height:100px;">${esc(t.closingParagraph)}</textarea></div>
            <div class="row row-2">
              <div class="field"><label>Nama Penandatangan</label><input id="tf-signame" type="text" value="${esc(t.signatoryName)}"></div>
              <div class="field"><label>Jabatan</label><input id="tf-sigtitle" type="text" value="${esc(t.signatoryTitle)}"></div>
            </div>
          </div>
          <div class="modal-foot"><button class="btn" onclick="App.closeModal()">Batal</button><button class="btn btn-primary" onclick="App.saveTemplateModal('${id||""}')">Simpan Template</button></div>
        </div>
      </div>`;
  },
  saveTemplateModal(id){
    const val = k=>document.getElementById(k).value;
    const data = {
      jenis: val("tf-jenis"), subjectDefault: val("tf-subject"), appreciationParagraph: val("tf-apresiasi"),
      mainParagraphHint: val("tf-main"), closingParagraph: val("tf-closing"),
      contactPerson:"", signatoryName: val("tf-signame"), signatoryTitle: val("tf-sigtitle"),
    };
    if(id){
      const idx=this.state.templates.findIndex(t=>t.id===id);
      this.state.templates[idx] = Object.assign(this.state.templates[idx], data);
    } else {
      this.state.templates.push(Object.assign({id:uid("tmpl")}, data));
    }
    this.persist().then(()=>{ this.closeModal(); this.toast("Template disimpan"); this.render(); });
  },
  deleteTemplate(id){
    this.confirmModal("Hapus template ini?","Surat yang sudah dibuat tidak akan terpengaruh.", ()=>{
      this.state.templates = this.state.templates.filter(t=>t.id!==id);
      this.persist().then(()=>{ this.closeModal(); this.toast("Template dihapus"); this.render(); });
    });
  },

  /* ---------------------------- Tenant database ---------------------------- */
  renderTenant(){
    const tenants=this.state.tenants;
    return `
      <div class="page-head">
        <div><div class="page-title">Tenant</div><div class="page-sub">${tenants.length} tenant terdaftar</div></div>
        <div class="action-row">
          <button class="btn" onclick="App.downloadTenantTemplateCSV()">⬇ Template CSV</button>
          <button class="btn" onclick="document.getElementById('tenant-import-input').click()">⬆ Import CSV/Excel</button>
          <button class="btn btn-primary" onclick="App.openTenantModal(null)">+ Tambah Tenant</button>
        </div>
        <input type="file" id="tenant-import-input" accept=".csv,.xlsx,.xls" style="display:none;" onchange="App.handleTenantImportFile(this.files[0]); this.value='';">
      </div>
      <div class="card">
        ${tenants.length ? `<table><thead><tr><th>Perusahaan</th><th>PIC</th><th>Email</th><th>Telepon</th><th>Lantai</th><th>Unit</th><th></th></tr></thead>
        <tbody>${tenants.map(t=>`
          <tr>
            <td style="font-weight:600;">${esc(t.perusahaan)}</td>

            <td><div class="action-row"><button class="link-btn" onclick="App.openTenantModal('${t.id}')">Edit</button><button class="link-btn" style="color:var(--danger);" onclick="App.deleteTenant('${t.id}')">Hapus</button></div></td>
          </tr>`).join("")}</tbody></table>` : `<div class="empty-state"><div class="e-ico">🏢</div>Belum ada data tenant.</div>`}

  },
  openTenantModal(id){
    const t = id? this.state.tenants.find(x=>x.id===id) : {perusahaan:"",pic:"",email:"",telp:"",lantai:"",unit:"",alamat:""};
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
        <div class="modal">
          <div class="modal-head"><div class="modal-title">${id?'Edit Tenant':'Tenant Baru'}</div><button class="x-close" onclick="App.closeModal()">✕</button></div>
          <div class="modal-body">
            <div class="field"><label>Nama Perusahaan</label><input id="tn-perusahaan" type="text" value="${esc(t.perusahaan)}"></div>
            <div class="row row-2">
              <div class="field"><label>Nama PIC</label><input id="tn-pic" type="text" value="${esc(t.pic)}"></div>
              <div class="field"><label>Email</label><input id="tn-email" type="email" value="${esc(t.email)}"></div>
            </div>
            <div class="row row-3">
              <div class="field"><label>Telepon</label><input id="tn-telp" type="text" value="${esc(t.telp)}"></div>
              <div class="field"><label>Lantai</label><input id="tn-lantai" type="text" value="${esc(t.lantai)}"></div>
              <div class="field"><label>Unit</label><input id="tn-unit" type="text" value="${esc(t.unit)}"></div>
            </div>
            <div class="field"><label>Alamat Lengkap</label><textarea id="tn-alamat">${esc(t.alamat)}</textarea></div>
          </div>
          <div class="modal-foot"><button class="btn" onclick="App.closeModal()">Batal</button><button class="btn btn-primary" onclick="App.saveTenantModal('${id||""}')">Simpan Tenant</button></div>
        </div>
      </div>`;
  },
  saveTenantModal(id){
    const val=k=>document.getElementById(k).value;
    const data={perusahaan:val("tn-perusahaan"),pic:val("tn-pic"),email:val("tn-email"),telp:val("tn-telp"),lantai:val("tn-lantai"),unit:val("tn-unit"),alamat:val("tn-alamat")};
    if(id){ const idx=this.state.tenants.findIndex(t=>t.id===id); this.state.tenants[idx]=Object.assign(this.state.tenants[idx],data); }
    else{ this.state.tenants.push(Object.assign({id:uid("tn")},data)); }
    this.persist().then(()=>{ this.closeModal(); this.toast("Tenant disimpan"); this.render(); });
  },
  deleteTenant(id){
    this.confirmModal("Hapus tenant ini?","Data tenant akan dihapus dari database.", ()=>{
      this.state.tenants=this.state.tenants.filter(t=>t.id!==id);
      this.persist().then(()=>{ this.closeModal(); this.toast("Tenant dihapus"); this.render(); });
    });
  },

  /* ---------------------------- Tenant CSV/Excel import ---------------------------- */
  downloadTenantTemplateCSV(){
    const header = "perusahaan,pic,email,telp,lantai,unit,alamat\n";
    const example = 'PT Contoh Sukses Mandiri,Budi Santoso,budi@contoh.co.id,0812-0000-0000,10,10-01,"Wisma 46 – Kota BNI Lantai 10, Jln. Jend. Sudirman Kav. 1, Jakarta 10220"\n';
    const blob = new Blob([header+example], {type:"text/csv;charset=utf-8;"});
    this.offerDownload(blob, "Template_Import_Tenant.csv", "Template CSV");
  },
  // Flexible header aliases so users can upload CSV/Excel exported from various systems.
  TENANT_FIELD_ALIASES:{
    perusahaan:["perusahaan","nama perusahaan","company","nama tenant","tenant"],
    pic:["pic","nama pic","contact person","cp","nama"],
    email:["email","e-mail"],
    telp:["telp","telepon","no telp","no. telp","phone","no hp","hp"],
    lantai:["lantai","floor"],
    unit:["unit","no unit","nomor unit"],
    alamat:["alamat","address","alamat lengkap"],
  },
  normalizeTenantRow(row){
    const out={perusahaan:"",pic:"",email:"",telp:"",lantai:"",unit:"",alamat:""};
    const keys = Object.keys(row);
    for(const field in this.TENANT_FIELD_ALIASES){
      const aliases = this.TENANT_FIELD_ALIASES[field];
      const foundKey = keys.find(k=> aliases.includes(String(k).trim().toLowerCase()));
      if(foundKey!=null && row[foundKey]!=null) out[field] = String(row[foundKey]).trim();
    }
    return out;
  },
  async handleTenantImportFile(file){
    if(!file) return;
    if(!window.XLSX){
      this.toast("Memuat pustaka pembaca file...");
      await window.__libsReadyPromise;
    }
    if(!window.XLSX){
      this.toast("⚠ Gagal memuat pustaka pembaca CSV/Excel. Periksa koneksi internet Anda, lalu muat ulang halaman.");
      return;
    }
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:"array"});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
        const parsed = rows.map(r=>this.normalizeTenantRow(r)).filter(t=>t.perusahaan || t.pic);
        if(!parsed.length){ this.toast("Tidak ada baris data yang terbaca — cek format file"); return; }
        this.showTenantImportPreview(parsed);
      }catch(err){
        console.error("[surat-app] tenant import error:", err);
        this.toast("⚠ Gagal membaca file: "+(err && err.message ? err.message : "format tidak dikenali"));
      }
    };
    reader.onerror = ()=> this.toast("⚠ Gagal membaca file dari komputer Anda.");
    reader.readAsArrayBuffer(file);
  },
  showTenantImportPreview(rows){
    this._pendingImport = rows;
    document.getElementById("modal-root").innerHTML = `
      <div class="modal-overlay" onclick="if(event.target===this) App.closeModal()">
        <div class="modal" style="max-width:760px;">
          <div class="modal-head"><div class="modal-title">Import Tenant — ${rows.length} baris ditemukan</div><button class="x-close" onclick="App.closeModal()">✕</button></div>
          <div class="modal-body">
            <p style="margin-top:0; color:var(--ink-soft); font-size:12.5px;">Periksa hasil pembacaan file sebelum ditambahkan ke database tenant.</p>
            <table><thead><tr><th>Perusahaan</th><th>PIC</th><th>Email</th><th>Telepon</th><th>Lantai</th><th>Unit</th></tr></thead>
            <tbody>${rows.map(t=>`<tr><td>${esc(t.perusahaan)||'<span style="color:var(--danger);">kosong</span>'}</td><td>${esc(t.pic)}</td><td>${esc(t.email)}</td><td>${esc(t.telp)}</td><td>${esc(t.lantai)}</td><td>${esc(t.unit)}</td></tr>`).join("")}</tbody></table>
          </div>
          <div class="modal-foot"><button class="btn" onclick="App.closeModal()">Batal</button><button class="btn btn-primary" onclick="App.confirmTenantImport()">✓ Tambahkan ${rows.length} Tenant</button></div>
        </div>
      </div>`;
  },
  confirmTenantImport(){
    const rows = this._pendingImport || [];
    rows.forEach(t=> this.state.tenants.push(Object.assign({id:uid("tn")}, t)));
    this._pendingImport = null;
    this.persist().then(()=>{ this.closeModal(); this.toast(rows.length+" tenant berhasil diimpor"); this.render(); });
  },

  /* ---------------------------- Settings ---------------------------- */
  renderSettings(){
    const s=this.state.settings;
    return `
      <div class="page-head"><div><div class="page-title">Pengaturan</div><div class="page-sub">Informasi default untuk surat baru</div></div></div>
      <div class="card card-pad" style="max-width:620px;">
        <div class="row row-2">
          <div class="field"><label>Kota Default</label><input id="set-kota" type="text" value="${esc(s.kotaDefault)}"></div>
          <div class="field"><label>Telepon Tenant Relation</label><input id="set-phone" type="text" value="${esc(s.contactPhone)}"></div>
        </div>
        <div class="field"><label>Nama Gedung</label><input id="set-building" type="text" value="${esc(s.buildingName)}"></div>
        <div class="field"><label>Alamat Gedung</label><textarea id="set-address">${esc(s.buildingAddress)}</textarea></div>
        <div class="row row-2">
          <div class="field"><label>Nama Penandatangan Default</label><input id="set-signame" type="text" value="${esc(s.signatoryName)}"></div>
          <div class="field"><label>Jabatan</label><input id="set-sigtitle" type="text" value="${esc(s.signatoryTitle)}"></div>
        </div>
        <div class="field"><label>Dibuat Oleh (nama Anda)</label><input id="set-author" type="text" value="${esc(s.dibuatOleh)}"></div>
        <div class="field"><label>Nomor urut surat berikutnya</label><input id="set-counter" type="number" value="${this.state.counter+1}">
          <div class="hint">Format nomor: [urut]/BM-TR/SK/[bulan romawi]/[tahun]</div></div>
        <button class="btn btn-primary" onclick="App.saveSettings()">Simpan Pengaturan</button>
        <div class="divider"></div>
        <div class="field"><label>Backup ke Komputer Anda</label>
          <div class="hint" style="margin-bottom:8px;">Data surat, template, dan tenant otomatis tersimpan di akun Claude Anda. Untuk menyimpan salinan langsung di komputer Anda sendiri (atau memindahkannya ke perangkat lain), unduh file backup di bawah ini — file ini berisi SELURUH data aplikasi.</div>
          <div class="action-row">
            <button class="btn btn-brass" onclick="App.downloadBackup()">⬇ Unduh Backup Data (.json)</button>
            <button class="btn" onclick="document.getElementById('backup-restore-input').click()">⬆ Pulihkan dari File Backup</button>
          </div>
          <input type="file" id="backup-restore-input" accept=".json" style="display:none;" onchange="App.handleRestoreFile(this.files[0]); this.value='';">
        </div>
        <div class="divider"></div>
        <div class="field"><label style="color:var(--danger);">Reset Data</label>
          <div class="hint" style="margin-bottom:8px;">Menghapus seluruh surat, template kustom, dan data tenant, lalu mengembalikan ke data contoh.</div>
          <button class="btn btn-danger" onclick="App.resetData()">Reset Seluruh Data</button>
        </div>
      </div>`;
  },
  saveSettings(){
    const val=k=>document.getElementById(k).value;
    const s=this.state.settings;
    s.kotaDefault=val("set-kota"); s.contactPhone=val("set-phone"); s.buildingName=val("set-building");
    s.buildingAddress=val("set-address"); s.signatoryName=val("set-signame"); s.signatoryTitle=val("set-sigtitle");
    s.dibuatOleh=val("set-author");
    const nextSeq=parseInt(val("set-counter"),10);
    if(!isNaN(nextSeq)) this.state.counter = nextSeq-1;
    this.persist().then(()=>{ this.toast("Pengaturan disimpan"); this.render(); });
  },
  resetData(){
    this.confirmModal("Reset seluruh data?","Semua surat, template, dan tenant akan dihapus permanen dari penyimpanan lokal Anda.", async ()=>{
      this.state = emptyState();
      await this.persist();
      this.closeModal(); this.toast("Data direset"); this.navigate("dashboard");
    });
  },

  /* ---------------------------- Backup / Restore (local file on the user's own computer) ---------------------------- */
  downloadBackup(){
    const payload = {
      _app: "surat-otomatis-building-management",
      _version: 1,
      exportedAt: new Date().toISOString(),
      state: this.state,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const stamp = todayISO();
    this.offerDownload(blob, `Backup_Surat_Otomatis_${stamp}.json`, "Backup Data");
  },
  handleRestoreFile(file){
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ this.toast("⚠ File backup tidak valid (bukan JSON yang benar)."); return; }
      const incoming = parsed && parsed.state ? parsed.state : parsed; // tolerate a raw state dump too
      if(!incoming || !Array.isArray(incoming.letters) || !Array.isArray(incoming.templates) || !Array.isArray(incoming.tenants)){
        this.toast("⚠ File ini tidak terlihat seperti backup aplikasi ini.");
        return;
      }
      this.confirmModal(
        "Pulihkan dari backup ini?",
        `File berisi ${incoming.letters.length} surat, ${incoming.templates.length} template, dan ${incoming.tenants.length} tenant. Ini akan MENGGANTIKAN seluruh data yang ada saat ini di aplikasi.`,
        async ()=>{
          this.state = {
            letters: incoming.letters || [],
            templates: (incoming.templates && incoming.templates.length) ? incoming.templates : defaultTemplates(),
            tenants: incoming.tenants || [],
            counter: typeof incoming.counter==="number" ? incoming.counter : 747,
            settings: incoming.settings || defaultSettings(),
          };
          await this.persist();
          this.closeModal();
          this.toast("Data berhasil dipulihkan dari backup");
          this.navigate("dashboard");
        },
        "Pulihkan Data",
        "btn-primary"
      );
    };
    reader.onerror = ()=> this.toast("⚠ Gagal membaca file dari komputer Anda.");
    reader.readAsText(file);
  },

  afterRenderHooks(){}
};

window.addEventListener("DOMContentLoaded", ()=>App.init());
</script>
